name: Deploy to Pages

# The build step changed the operating model and this workflow is where the
# change is contained.
#
# `reservoirs.json` is rewritten every morning by refresh-data.yml, and that
# commit *is* the deploy -- the pages fetch the file at runtime and the new
# numbers go live. So the rule this workflow exists to enforce is: data is
# copied into the published output, never bundled into it. vite.config.ts
# copies reservoirs.json and capacities.json into dist/ and dist/data/ at
# the end of the build; nothing imports them.
#
# The corollary is that a failing build now freezes the dashboard's numbers,
# which is why the unit tests are written against shared/reservoir-viz.js
# rather than against literals from one day's payload. A data refresh cannot
# turn this workflow red on its own.
#
on:
  push:
    branches: ["main"]
  # The refresh workflow pushes with GITHUB_TOKEN. GitHub deliberately does
  # not create a second workflow run from that push, so a push-only Pages
  # trigger leaves the published data behind. Chain from the successful
  # refresh run as the explicit, non-recursive handoff.
  workflow_run:
    workflows: ["Refresh reservoir data", "Publish weekly figures"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel. An in-flight deploy is usually publishing the
# morning's data; cancelling it in favour of a later run risks leaving the
# site a refresh behind for no benefit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the published site
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # issues: the share-picture issue below, and nothing else.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # The ArcGIS 5.1 application is the root production page. The retired
      # application paths remain as small redirect pages. Asserted here rather
      # than trusted, because two of those copies happen in a closeBundle hook
      # that no other job exercises. The list is scripts/published-files.json,
      # the one vite.config.ts builds from; the script also fails if the
      # payload was bundled into dist/assets.
      - name: Verify the published output still serves every current URL
        run: node scripts/check-dist.mjs

      # ADR-154: the pictures behind permanent reservoir and scope links,
      # captured from the site just built. dist/share/*.png already holds the
      # generated figure-free fallback images, so this step can only replace a good image
      # with a fresher one. It downloads no browser: it installs the repo's
      # own Playwright package (scripts/install-playwright.sh, npm only) and
      # drives the Google Chrome the runner image already carries. With no
      # Chrome, a failed install or a frame that does not draw, the fallback
      # stays and a warning is logged; the step fails only when an image is
      # missing or is not a 1200 by 630 PNG.
      - name: Capture the share images (a failure keeps the figure-free fallbacks)
        run: bash scripts/share-images.sh

      # A fallback used to be only a log warning, so a picture could go
      # without its figure for weeks unseen. One labelled issue holds every
      # failed capture, is edited on each deploy while any remain, and closes
      # when all are captured again. Main only: a branch run says nothing
      # about the published site. Never blocks the deploy.
      - name: Open, update or close the share-picture issue
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python3 tools/feed_issue_report.py share \
            --report dist/share/capture-report.json --body-file share-issue.md)
          if [ -n "$TITLE" ]; then
            scripts/gh-selfhealing-issue.sh open share "$TITLE" share-issue.md
          else
            scripts/gh-selfhealing-issue.sh close share \
              "Every share picture was captured on $(date -u '+%Y-%m-%d'). Closing automatically."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
