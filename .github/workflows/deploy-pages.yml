name: Deploy to Pages

# The build step changed the operating model and this workflow is where the
# change is contained.
#
# `reservoirs.json` is rewritten every morning by refresh-data.yml, and that
# commit *is* the deploy -- the pages fetch the file at runtime and the new
# numbers go live. So the rule this workflow exists to enforce is: data is
# copied into the published output, never bundled into it. vite.config.ts
# copies reservoirs.json and capacities.json into dist/ and dist/data/ at
# the end of the build; nothing imports them.
#
# The corollary is that a failing build now freezes the dashboard's numbers,
# which is why the unit tests are written against shared/reservoir-viz.js
# rather than against literals from one day's payload. A data refresh cannot
# turn this workflow red on its own.
#
on:
  push:
    branches: ["main"]
  # The refresh workflow pushes with GITHUB_TOKEN. GitHub deliberately does
  # not create a second workflow run from that push, so a push-only Pages
  # trigger leaves the published data behind. Chain from the successful
  # refresh run as the explicit, non-recursive handoff.
  workflow_run:
    workflows: ["Refresh reservoir data"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel. An in-flight deploy is usually publishing the
# morning's data; cancelling it in favour of a later run risks leaving the
# site a refresh behind for no benefit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the published site
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build

      # The ArcGIS 5.1 application is the root production page. The retired
      # application paths remain as small redirect pages. Asserted here rather
      # than trusted, because two of those copies happen in a closeBundle hook
      # that no other job exercises.
      - name: Verify the published output still serves every current URL
        run: |
          missing=0
          for path in index.html modern.html legacy/index.html \
                      overview.html precipitation.html snow.html drought.html methods.html data.html \
                      lakes.html lakes.json data/lakes.json \
                      elevation_history.json data/elevation_history.json \
                      rivers.html rivers.json data/rivers.json \
                      data/drought/usdm-current.geojson data/drought/usdm-huc6.json \
                      explore.html maplibre/index.html retired-route.js \
                      terms.html landscape.html story.html \
                      share/lake-powell.html share/lake-mead.html \
                      share/lake-powell.png share/lake-mead.png \
                      reservoirs.json capacities.json \
                      snow_sites.json snowpack.json reference.json \
                      data/reservoirs.json data/capacities.json \
                      data/snow_sites.json data/snowpack.json \
                      data/snow/snowpack-wy2026.json \
                      data/precipitation.json data/precipitation_history.json \
                      data/soil_moisture.json \
                      data/reference.json data/drought/usdm-current.geojson; do
            if [ ! -s "dist/$path" ]; then
              echo "::error title=Missing from dist::$path"
              missing=1
            fi
          done
          for path in api/reservoirs.json api/lakes.json api/elevation_history.json \
                      api/rivers.json api/snowpack.json api/reference.json; do
            if [ ! -s "dist/$path" ]; then
              echo "::error title=Missing API alias::$path"
              missing=1
            fi
          done
          # The runtime-data rule, checked directly: the published JS must
          # not contain the payload. A bundled reservoirs.json would make
          # every daily refresh depend on a successful rebuild.
          as_of=$(node -p "require('./reservoirs.json').generated_at")
          if grep -rqF "$as_of" dist/assets 2>/dev/null; then
            echo "::error title=Data was bundled::dist/assets contains the payload's generated_at; data must be fetched at runtime, not built in"
            missing=1
          fi
          exit $missing

      # ADR-141: the picture behind a shared Lake Powell or Lake Mead link,
      # captured from the site just built. dist/share/*.png already holds the
      # committed fallback images, so this step can only replace a good image
      # with a fresher one. It downloads no browser: it installs the repo's
      # own Playwright package (scripts/install-playwright.sh, npm only) and
      # drives the Google Chrome the runner image already carries. With no
      # Chrome, a failed install or a frame that does not draw, the fallback
      # stays and a warning is logged; the step fails only when an image is
      # missing or is not a 1200 by 630 PNG.
      - name: Capture the share images (a failure keeps the committed fallbacks)
        run: bash scripts/share-images.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
