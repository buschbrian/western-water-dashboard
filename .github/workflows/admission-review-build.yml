name: Complete the reviewed Topaz admission bundle

# Temporary branch build. Removed after the generated bundle is verified.
on:
  push:
    branches: [topaz-lake]
    paths: [.github/workflows/admission-review-build.yml]

permissions:
  contents: write

concurrency:
  group: admission-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-test.txt
      - name: Build the admission bundle with the repository's USGS key
        env:
          PYTHONUNBUFFERED: "1"
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          python refresh_reservoirs.py --source usgs
          python tools/build_normal_baselines.py --only "Topaz Lake"
          python refresh_reservoirs.py --source usgs
          python tools/build_reference_export.py
          python tools/build_assistant_indexes.py
          scripts/verify-pipeline.sh -q
      - name: Commit the verified generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add normals.json reservoirs.json reference.json data/assistant/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete Topaz climate baseline and preserve all three admissions"
          git push
