name: Publish weekly figures

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - name: Install locked build tools
        run: npm ci
      - name: Capture the week's figures
        run: node scripts/build-weekly-digest.mjs
      - name: Commit the appended entry
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add data/weekly-digest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Water data refresh"
          git config user.email "actions@github.com"
          git commit -m "Save the weekly water figures"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
