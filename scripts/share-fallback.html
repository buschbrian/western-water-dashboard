<!doctype html>
<!-- Visual source for public/share/fallback.png (ADR-154). It carries no
     reservoir name or water figure and is safe for every share address. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Share image fallback</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { box-sizing: border-box; padding: 48px 64px; background: #f3eee6; color: #2f342f;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; justify-content: space-between; }
    p { margin: 0; }
    .site { font-size: 30px; font-weight: 600; color: #655f55; }
    h1 { margin: 0; font-size: 76px; line-height: 1.05; }
    .what { margin-top: 20px; font-size: 44px; color: #1d4e6b; font-weight: 600; }
    .more { font-size: 30px; color: #655f55; }
    .source { margin-top: 10px; font-size: 24px; color: #655f55; }
    .rule { block-size: 0; border-block-start: 6px solid #1d4e6b; inline-size: 120px; margin-bottom: 28px; }
  </style>
</head>
<body>
  <p class="site">Western Water Dashboard</p>
  <div>
    <div class="rule"></div>
    <h1>Water across the West</h1>
    <p class="what">Reservoir storage, snow and drought</p>
  </div>
  <div>
    <p class="more">Open the dashboard for current readings and sources.</p>
    <p class="source">buschbrian.github.io/western-water-dashboard</p>
  </div>

</body>
</html>
